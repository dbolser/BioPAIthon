# Type-check the files in this directory as downstream code that uses Bio:
# mypy --strict, with errors inside Bio itself silenced. The files are only
# type-checked, never run (and are not test_*.py, so run_tests.py skips them).
#
# assert_type pins what an expression is inferred as. A line that must be
# rejected carries "# type: ignore[code]"; warn_unused_ignores turns that into
# a failure if the line stops being an error.
#
# From the repository root (the pre-commit hook "mypy-downstream" runs this):
#
#   mypy --config-file Tests/downstream_typing/mypy.ini Tests/downstream_typing
#
# There is deliberately no python_version: like a user's run, it checks
# against the Python that runs mypy.

[mypy]
strict = True
follow_imports = silent
warn_unused_ignores = True
