[build-system]
# >=77 is required for the PEP 639 `license` string and `license-files` list
# below; it also covers the >=74.1 needed for the ext-modules table.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biopaithon"
dynamic = ["version"]
description = "Freely available tools for computational molecular biology - a fork of Biopython open to contributors of every kind."
readme = "README.rst"
requires-python = ">=3.10"
license = "LicenseRef-Biopython-License-Agreement"
license-files = ["LICENSE.rst"]
# Authorship stays with the Biopython contributors, who wrote essentially all
# of this code. BioPAIthon is a downstream fork, not a new work.
authors = [
    {name = "The Biopython Contributors", email = "biopython@biopython.org"}
]
maintainers = [
    {name = "The BioPAIthon Contributors"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24,<3",
]

# Membership derived from what the code actually imports (each package below
# is imported lazily and raises MissingPythonDependencyError when absent).
[project.optional-dependencies]
# Bio.Graphics: reportlab throughout; Bio.Graphics.KGML_vis also needs PIL.
graphics = [
    "reportlab",
    "pillow",
]
# BioSQL's default driver is "MySQLdb", provided by mysqlclient, which
# Bio.motifs.jaspar.db also uses. mysql-connector-python, psycopg2 and pgdb
# are supported alternatives (pass driver= to open_database); sqlite3 is in
# the standard library. An extra cannot offer a choice, so it installs the
# default.
biosql = [
    "mysqlclient",
]
# Bio.PDB.binary_cif needs msgpack. mmtf-python is deliberately NOT here:
# RCSB shut the MMTF service down in July 2024 (mmtf.rcsb.org no longer
# resolves), the package's last release was 2022, and Bio.PDB.mmtf is slated
# for removal — an extra should not advertise it to new users. It remains in
# `test` while the offline mmtf parser tests still exist.
structure = [
    "msgpack",
]
# Bio.Phylo: draw() needs matplotlib, to_networkx() needs networkx,
# to_igraph() needs igraph>=0.10, and CDAO support needs rdflib.
phylo = [
    "matplotlib",
    "networkx",
    "igraph>=0.10.0",
    "rdflib",
]
# scipy is used by Bio.phenotype, Bio.codonalign and Bio.Align.analysis,
# which fit none of the named stacks, so it is listed here directly.
all = [
    "biopaithon[graphics,biosql,structure,phylo]",
    "scipy",
]
# What the offline test suite exercises; ci-dependencies.txt installs this
# extra so the two cannot drift. Not simply `all`: BioSQL MySQL testing is
# disabled (upstream #3834), so no mysqlclient. mmtf-python is still needed
# for the offline mmtf parser tests; numpy 2.1.0 is excluded per upstream
# (see ci-dependencies.txt history).
test = [
    "biopaithon[graphics,phylo,structure]",
    "coverage",
    "mmtf-python",
    "numpy!=2.1.0",
    "pytest>=9",
    "pytest-cov",
    "pytest-xdist",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/dbolser/BioPAIthon/"
Source = "https://github.com/dbolser/BioPAIthon/"
Tracker = "https://github.com/dbolser/BioPAIthon/issues"
"Upstream project" = "https://biopython.org/"
"Upstream documentation" = "https://biopython.org/wiki/Documentation"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["Bio", "Bio.*", "BioSQL", "BioSQL.*"]
# Load-bearing, though it is the default: Bio/Align/substitution_matrices/data,
# Bio/Entrez/DTDs and Bio/Entrez/XSDs hold data files but no __init__.py, so
# only namespace discovery lists them as packages. Without it, setuptools warns
# "Package would be ignored" for each (see upstream #4050).
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "Bio.__version__"}

# C extension modules using setuptools 74.1+ native support
[[tool.setuptools.ext-modules]]
name = "Bio.Align._aligncore"
sources = ["Bio/Align/_aligncore.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.Align._alignmentcounts"
sources = ["Bio/Align/_alignmentcounts.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.Align._codonaligner"
sources = ["Bio/Align/_codonaligner.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.Align._pairwisealigner"
sources = ["Bio/Align/_pairwisealigner.c"]
depends = ["Bio/Align/_pairwisealigner.h", "Bio/Align/_pairwisealigner_linear.h"]

[[tool.setuptools.ext-modules]]
name = "Bio.Align.substitution_matrices._arraycore"
sources = ["Bio/Align/substitution_matrices/_arraycore.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.Nexus.cnexus"
sources = ["Bio/Nexus/cnexus.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.motifs._pwm"
sources = ["Bio/motifs/_pwm.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.Cluster._cluster"
sources = ["Bio/Cluster/cluster.c", "Bio/Cluster/clustermodule.c"]
extra-compile-args = ["-DCLUSTER_USE_PYTHON_MEMORY"]

[[tool.setuptools.ext-modules]]
name = "Bio.PDB.ccealign"
sources = ["Bio/PDB/ccealignmodule.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.PDB.kdtrees"
sources = ["Bio/PDB/kdtrees.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.PDB._bcif_helper"
sources = ["Bio/PDB/bcifhelpermodule.c"]

[[tool.setuptools.ext-modules]]
name = "Bio.SeqIO._twoBitIO"
sources = ["Bio/SeqIO/_twoBitIO.c"]

# Wheel build settings, shared by .github/workflows/release.yml and any local
# `cibuildwheel` run, so the two cannot drift.
[tool.cibuildwheel]
# cp314t is the free-threaded build of Python 3.14. cp313t is not built, as
# free threading is experimental in 3.13; installing from the sdist works there.
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
# 32-bit targets are unsupported. PyPy is skipped for now: it is supported via
# the sdist, but the C extensions are not exercised on PyPy in CI yet.
skip = ["*_i686", "*-win32", "pp*"]
build-frontend = "build"
# Imports every compiled extension, and on a free-threaded build checks that
# the GIL is still off afterwards. The script is in .github/ so that it is
# not run from the source tree, which would shadow the installed wheel.
test-command = "python {project}/.github/check_wheel.py"

# GitHub retired the macos-13 (Intel) runners and deprecated macos-14, so all
# macOS wheels are built on an arm64 runner. x86_64 is cross-compiled there.
# cibuildwheel cannot run an x86_64 wheel on an arm64 host, so it skips the
# test-command for those: Intel Mac wheels are build-verified but not
# import-tested. Free runners have no Intel macOS host; the macos-15-intel
# labels are the "large" class and are generally billable.
[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[dependency-groups]
dev = [
    "pytest>=9",
    "setuptools>=77",
]

# The test suite in Tests/ runs under pytest; Tests/conftest.py carries the
# suite's own rules (--offline, --check-skips, import-time dependency skips,
# the doctest collector). pytest 9 is the floor because it reports unittest
# subTest failures individually; 8.x reported one failure per test method.
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["Tests"]
python_files = ["test_*.py"]
# Collect only unittest.TestCase subclasses, which pytest's unittest support
# finds whatever their name. This is exactly the set run_tests.py ran; a
# plain pytest-style test function would be silently ignored, as before.
python_classes = []
python_functions = []
# Like run_tests.py, report a module that fails to import and run the rest.
addopts = "--continue-on-collection-errors"

# Coverage of the test suite, as CI measures it with pytest-cov:
#   cd Tests && python -m pytest --offline --cov --cov-config=../pyproject.toml
# coverage reads its configuration only from the current directory unless
# told otherwise, hence --cov-config. These are packages, not paths: run from
# Tests/, a path BioSQL would name the test data directory Tests/BioSQL.
[tool.coverage.run]
source_pkgs = ["Bio", "BioSQL"]

[tool.coverage.report]
# Besides coverage's own defaults (such as "# pragma: no cover"), leave out
# debug-only code and the self-tests of modules that can be run as scripts.
exclude_also = [
    "if __debug__:",
    "if __name__ == .__main__.:",
]
