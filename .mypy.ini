[mypy-Bio.pairwise2.*]
# deprecated module
ignore_errors = True

# ----------------------------------------------------------------------------
# check_untyped_defs ratchet baseline.
#
# check_untyped_defs is on globally. The sections below list the modules that
# already had errors on the day it was enabled, and switch it off for exactly
# those modules so the tree stays green while everything else - including
# every NEW module - is fully checked.
#
# The rule: entries may only be REMOVED from this list (after fixing the
# module so it passes with check_untyped_defs on), never added. New modules
# are born checked. To retire an entry, delete its section and run the mypy
# pre-commit hook.
#
# Generated mechanically from mypy 1.16.1 output; do not hand-edit beyond
# deleting entries.
# ----------------------------------------------------------------------------

