name: CI

# Avoid running multiple jobs for the same branch
# in case of updates. The event name is part of the group so that a push to
# main cannot cancel an in-progress weekly scheduled run (or vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Run on pull requests and push events to main, plus a weekly scheduled run
# that installs dependencies fresh instead of from the cache.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Mondays 03:00 UTC. Scheduled runs skip the pip environment cache steps
    # below, so `pip install --upgrade --upgrade-strategy eager` really runs
    # and picks up new dependency releases even though pyproject.toml and
    # ci-dependencies.txt are unchanged.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  # Cache-busting knob for the pip environment caches below. Their keys hash
  # pyproject.toml and the requirements files, but while those are unchanged
  # the cached environment is reused and dependencies are never upgraded.
  # Bump this number to discard every pip cache and force fresh installs.
  # (The previous hard-coded key segment was "v2", hence starting at 3.)
  CACHE_EPOCH: "3"

jobs:
  # Style Checking: Linux and Python version only.
  style:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Check only files changed by the PR/push. JSON keeps filenames as data,
    # including whitespace and shell metacharacters.
    - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
      id: changed-files
      with:
        json: "true"
        escape_json: "false"
        safe_output: "false"

    # Cache CI packages
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      id: cache-precommit
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-precommit-hooks-v2-${{ hashFiles('**/.pre-commit-config.yaml') }}

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.10"

    - name: Installing pre-commit
      run: |
        python -m pip install pre-commit

    - name: Installing pre-commit hooks (cached)
      if: steps.cache-precommit.outputs.cache-hit != 'true'
      run: |
        pre-commit install --install-hooks

    - name: Run style checking via pre-commit
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        python - <<'PY'
        import json
        import os
        import subprocess

        files = json.loads(os.environ["ALL_CHANGED_FILES"])
        if files:
            subprocess.run(
                ["pre-commit", "run", "--show-diff-on-failure", "--files", *files],
                check=True,
            )
        PY

  # Cache pip & python dependencies for Linux runner
  # since it is used in most actions.
  # Adapted from: https://medium.com/ai2-blog/python-caching-in-github-actions-e9452698e98d
  linux_prep:
    needs: [style]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    # Skipped on scheduled runs so the weekly build installs everything
    # fresh. With this step skipped, cache-hit below is empty (not "true"),
    # so the install step runs, and nothing is saved back to the cache.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.event_name != 'schedule'
      id: cache-pip
      with:
        path: ${{ env.pythonLocation }}
        key: ${{runner.os}}-${{ env.pythonLocation }}-${{ matrix.python-version }}-v${{ env.CACHE_EPOCH }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('**/ci-dependencies.txt') }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Install Python dependencies
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade --upgrade-strategy eager -r ci-dependencies.txt

  # Try building package:
  # - tarball on Linux
  # - wheels on all supported OSes and Linux, MacOS, and Windows
  build:
    needs: [style]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.10"

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Package tarball
      run: |
        python -m build --sdist

    # Guard against the sdist silently regrowing. The dominant content is
    # Tests/ fixture data (the sdist is deliberately self-testing). The cap
    # that matters is on the *unpacked* size — the sum of the tar members —
    # because highly compressible fixtures barely move the tarball: removing
    # a 40 MB XML fixture shrank the .tar.gz by only 0.27 MB. Both caps are
    # ~2x the sizes measured when they were introduced (19.7 MB compressed,
    # 84.3 MB unpacked, 2026-08). If this fails, a large fixture was probably
    # added: gzip it (several tests already read fixtures through gzip.open)
    # or trim it.
    - name: Check sdist size
      run: |
        python - <<'PY'
        import glob
        import os
        import sys
        import tarfile

        compressed_limit = 40_000_000  # bytes
        unpacked_limit = 170_000_000  # bytes, sum of regular members
        [sdist] = glob.glob("dist/*.tar.gz")
        compressed = os.path.getsize(sdist)
        with tarfile.open(sdist, "r:gz") as tar:
            unpacked = sum(m.size for m in tar if m.isreg())
        print(f"{sdist}: {compressed:,} bytes compressed (limit {compressed_limit:,}),")
        print(f"  {unpacked:,} bytes unpacked (limit {unpacked_limit:,})")
        if compressed > compressed_limit or unpacked > unpacked_limit:
            sys.exit("sdist exceeds its size cap; see this step's comment in ci.yml")
        PY

  # Note: CI deliberately does not build wheels. Compiling the C extensions on
  # each OS is already covered by the test jobs below, which all `pip install .`
  # from source. Real, installable, import-tested wheels are built by
  # release.yml using cibuildwheel.

  # Run tests in parallel across Linux, MacOS, and Windows
  # hosts (thus the three steps and not the single matrix entry).
  #
  # Linux tests install all the dev dependencies, while MacOS and Windows
  # tests install only numpy (lightweight version).
  # NOTE: PyPy only runs on Linux with minimal dependencies because it's running slowly.
  #
  # Tests trigger only of the style and build steps succeed.
  #

  # Linux is where the thorough tests run. Install all dependencies and run all (offline) tests.
  # Every supported CPython is compiled and tested here. This is what replaces
  # the old build_wheels matrix: that only proved the C extensions compiled,
  # whereas these jobs compile them and then run the suite against them.
  test_linux:
    # 30, not 20: this job runs the whole suite under ASan/UBSan with
    # PYTHONMALLOC=debug, and observed times are 9-18 min per version. Under
    # runner contention 3.12 exceeded the old 20 min cap and was cancelled,
    # which silently skipped check_tests and docs downstream.
    timeout-minutes: 30
    needs: [style, build, linux_prep]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:

    # BioSQL needs a running database server, so it is exercised on one
    # matrix entry rather than all five. The runner image ships MySQL 8
    # preinstalled (credentials root/root) but not running.
    - name: Start MySQL server (for BioSQL tests)
      if: matrix.python-version == '3.12'
      run: |
        sudo /etc/init.d/mysql start

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    # Retrieve cache to speed things up. The key must stay identical to the
    # one in linux_prep, which populates this cache. Skipped on scheduled
    # runs so the weekly build installs everything fresh (cache-hit is then
    # empty, so the install step below runs).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.event_name != 'schedule'
      id: cache-pip
      with:
        path: ${{ env.pythonLocation }}
        key: ${{runner.os}}-${{ env.pythonLocation }}-${{ matrix.python-version }}-v${{ env.CACHE_EPOCH }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('**/ci-dependencies.txt') }}

    - name: Install dependencies
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: |
          python -m pip install --upgrade --upgrade-strategy eager -r ci-dependencies.txt

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        CC="gcc -fsanitize=address -fsanitize=undefined -g" python -m pip install .

    # mysqlclient is installed here rather than via the `test` extra in
    # pyproject.toml because only this matrix entry has a server to talk to;
    # on the other entries Tests/test_BioSQL_MySQLdb.py skips as before.
    # It was originally disabled for all jobs due to upstream #3834, a
    # runner-image bug (actions/virtual-environments#4799, static TLS
    # exhaustion importing MySQLdb) fixed in the images in early 2022.
    # Tests/biosql.ini is gitignored and read by Tests/common_BioSQL.py; the
    # tests create and drop the biosql_test database themselves, so nothing
    # is created here. An empty dbuser disables the PostgreSQL section.
    - name: Configure BioSQL MySQL tests
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install mysqlclient
        tee Tests/biosql.ini <<'EOF'
        [mysql]
        dbhost=127.0.0.1
        dbuser=root
        dbpasswd=root
        testdb=biosql_test

        [pg]
        dbhost=localhost
        dbuser=
        dbpasswd=
        testdb=biosql_test
        EOF

    - name: Run test suite
      # detect_leaks=0 is deliberate and should stay. LeakSanitizer reports
      # what is unreleased at process exit, which for CPython is dominated by
      # the interpreter's own import machinery: over a single test module it
      # reported 1.16 MB in 1039 allocations, none of which had a Biopython
      # frame anywhere in its stack. Suppressions cannot separate them either,
      # because a suppression matches if any frame matches and every call into
      # our C arrives through _PyEval_EvalFrameDefault. Leaks are covered
      # instead by Tests/test_C_extension_memory.py, which measures growth
      # across repeated calls; see Tests/memory_growth.py.
      run: |
        cd Tests
        PYTHONMALLOC=debug LD_PRELOAD="$(realpath "$(gcc -print-file-name=libasan.so)") $(realpath "$(gcc -print-file-name=libstdc++.so)")" ASAN_OPTIONS="detect_leaks=0" coverage run --source Bio,BioSQL run_tests.py --offline
        coverage xml
      shell: bash

    - name: Upload coverage to codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
      with:
        name: Linux GitHub Actions ${{ matrix.python-version }}
        disable_search: true
        files: Tests/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test_macos:
    timeout-minutes: 15
    needs: [style, build]
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel coverage

    - name: Install minimal Python dependencies
      run: |
        python -m pip install numpy

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Run test suite
      run: |
        cd Tests
        coverage run --source Bio,BioSQL run_tests.py --offline
        coverage xml

    - name: Upload coverage to codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
      with:
        name: macOS GitHub Actions ${{ matrix.python-version }}
        disable_search: true
        files: Tests/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test_windows:
    timeout-minutes: 15
    needs: [style, build]
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel coverage

    - name: Install minimal Python dependencies
      run: |
        python -m pip install numpy msgpack

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Run test suite
      run: |
        cd Tests
        coverage run --source Bio,BioSQL run_tests.py --offline
        coverage xml

    - name: Upload coverage to codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
      with:
        name: Windows GitHub Actions ${{ matrix.python-version }}
        disable_search: true
        files: Tests/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test_pypy:
    timeout-minutes: 20  # a little more time
    needs: [style, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [pypy-3.10]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install minimal Python dependencies
      run: |
        python -m pip install numpy

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Run test suite
      run: |
        cd Tests
        python run_tests.py --offline

  # Flag step
  check_tests:
    needs: [test_linux, test_macos, test_windows]
    runs-on: ubuntu-latest
    steps:
      - run: echo All tests passed.

  # Check and build (API) documentation if everything passes.
  docs:
    needs: [check_tests]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.10"

    # This key used to interpolate matrix.python-version, but this job has no
    # strategy, so that expression was empty; it also hashed
    # ci-dependencies.txt, which this job does not install from. The "docs"
    # segment keeps the key distinct from the linux_prep/test_linux caches,
    # which share this runner and Python version but hold a different
    # environment. Skipped on scheduled runs so the weekly build installs
    # everything fresh (cache-hit is then empty, so the install step runs).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.event_name != 'schedule'
      id: cache-pip
      with:
        path: ${{ env.pythonLocation }}
        key: ${{runner.os}}-docs-${{ env.pythonLocation }}-v${{ env.CACHE_EPOCH }}-${{ hashFiles('Doc/requirements-sphinx.txt') }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install dependencies
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade --upgrade-strategy eager -r Doc/requirements-sphinx.txt

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Make documentation
      run: |
        make -C Doc html
      shell: bash
